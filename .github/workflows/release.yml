name: Make Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  android:
    name: Android
    needs: test
    uses: ./.github/workflows/build-android.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  linux:
    name: Linux
    needs: test
    uses: ./.github/workflows/build-linux.yml

  windows:
    name: Windows
    needs: test
    uses: ./.github/workflows/build-windows.yml

  artifact:
    name: Zip all artifacts into a single archive
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Set up artifact directory
        run: mkdir -p dist/artifacts
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/artifacts
      - name: Zip artifacts
        run: tar -czf dist/jellyxr-release.tar.gz -C dist/artifacts .
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: jellyxr-release
          path: dist/jellyxr-release.tar.gz
          if-no-files-found: error
          retention-days: 1
