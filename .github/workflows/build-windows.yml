name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build PC video plugin
        run: ./tools/build-pc-video.ps1 -Python (Get-Command python).Source

      - name: Install Godot and export templates
        run: |
          $release = "$env:GODOT_VERSION-stable"
          $baseUrl = "https://github.com/godotengine/godot-builds/releases/download/$release"
          Invoke-WebRequest "$baseUrl/Godot_v${release}_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Invoke-WebRequest "$baseUrl/Godot_v${release}_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          $templateDirectory = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateDirectory | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $templateDirectory -Recurse
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v${release}_win64_console.exe" >> $env:GITHUB_ENV

      - name: Import project
        run: |
          & $env:GODOT --headless --xr-mode off --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed.' }

      - name: Test PC playback and controls
        run: |
          foreach ($test in 'test_pc_video', 'test_core', 'test_seek', 'test_recenter', 'test_timeline') {
            & $env:GODOT --headless --xr-mode off --path . --script "tests/$test.gd"
            if ($LASTEXITCODE -ne 0) { throw "$test failed." }
          }
          python tests/test_pc_streaming.py --godot $env:GODOT
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated PC streaming failed.' }

      - name: Export Windows build
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          & $env:GODOT --headless --xr-mode off --path . --export-release 'Windows SteamVR' dist/windows/jellyframe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed.' }
          foreach ($file in 'jellyframe.exe', 'jellyframe.pck', 'jellyframe_mpv.dll', 'libmpv-2.dll') {
            if (-not (Test-Path "dist/windows/$file")) { throw "Export is missing $file." }
          }
          New-Item -ItemType Directory -Force dist/windows/licenses | Out-Null
          Copy-Item build/desktop/deps/godot-cpp-godot-4.5-stable/LICENSE.md dist/windows/licenses/godot-cpp.txt
          Copy-Item native/pc/THIRD_PARTY.md dist/windows/licenses/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: jellyframe-windows-${{ github.run_number }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Check Windows startup
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jellyframe-windows-${{ github.run_number }}
          path: build

      - name: Start exported app without VR
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'jellyframe-smoke.log'
          $process = Start-Process -FilePath ./build/jellyframe.exe `
            -ArgumentList '--headless', '--xr-mode', 'off', '--quit-after', '10', '--log-file', $logPath `
            -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Windows startup check timed out.'
          }
          if (Test-Path $logPath) { Get-Content $logPath }
          if ($process.ExitCode -ne 0) { throw "Windows startup failed: $($process.ExitCode)" }
          if (-not (Test-Path $logPath)) { throw 'Windows startup produced no log.' }
          if (Select-String -Path $logPath -Pattern 'SCRIPT ERROR:|ERROR:') {
            throw 'Windows startup logged errors.'
          }
