name: Build Windows SteamVR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Windows x64 OpenXR build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Godot and export templates
        run: |
          release="${GODOT_VERSION}-stable"
          base_url="https://github.com/godotengine/godot-builds/releases/download/${release}"
          curl --fail --location --retry 3 "${base_url}/Godot_v${release}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "${base_url}/Godot_v${release}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${release}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          mv "$RUNNER_TEMP/export-templates/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Import project
        run: godot --headless --xr-mode off --path . --editor --import --quit

      - name: Export Windows build
        run: |
          mkdir -p dist/windows
          godot --headless --xr-mode off --path . --export-release "Windows SteamVR" dist/windows/jellyframe.exe
          test -s dist/windows/jellyframe.exe
          test -s dist/windows/jellyframe.pck

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: jellyframe-windows-steamvr-${{ github.run_number }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Check Windows startup
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jellyframe-windows-steamvr-${{ github.run_number }}
          path: build

      - name: Start exported app without VR
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'jellyframe-smoke.log'
          $process = Start-Process -FilePath ./build/jellyframe.exe `
            -ArgumentList '--headless', '--xr-mode', 'off', '--quit-after', '10', '--log-file', $logPath `
            -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Windows startup check timed out.'
          }
          if (Test-Path $logPath) { Get-Content $logPath }
          if ($process.ExitCode -ne 0) { throw "Windows startup failed: $($process.ExitCode)" }
          if (-not (Test-Path $logPath)) { throw 'Windows startup produced no log.' }
          if (Select-String -Path $logPath -Pattern 'SCRIPT ERROR:|ERROR:') {
            throw 'Windows startup logged errors.'
          }
