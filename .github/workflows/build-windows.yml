name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build PC video plugin
        run: ./tools/build-pc-video.ps1 -Python (Get-Command python).Source

      - name: Build Godot Windows video export template
        run: ./tools/build-godot-windows-video.ps1 -Python (Get-Command python).Source -Jobs 4

      - name: Install Godot and export templates
        run: |
          $release = "$env:GODOT_VERSION-stable"
          $baseUrl = "https://github.com/godotengine/godot-builds/releases/download/$release"
          Invoke-WebRequest "$baseUrl/Godot_v${release}_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Invoke-WebRequest "$baseUrl/Godot_v${release}_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          $templateDirectory = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateDirectory | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $templateDirectory -Recurse
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v${release}_win64_console.exe" >> $env:GITHUB_ENV

      - name: Import Godot project
        run: |
          & $env:GODOT --headless --xr-mode off --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed.' }

      - name: Export Windows build
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          & $env:GODOT --headless --xr-mode off --path . --export-release 'Windows' dist/windows/jellyxr.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed.' }

      - name: Verify Windows export files
        run: |
          foreach ($file in 'jellyxr.exe', 'jellyxr.pck', 'jellyxr_mpv.dll', 'libmpv-2.dll', 'avcodec-62.dll', 'avformat-62.dll', 'avutil-60.dll', 'swscale-9.dll', 'swresample-6.dll') {
            if (-not (Test-Path "dist/windows/$file")) { throw "Export is missing $file." }
          }

      - name: Verify exported renderer settings
        run: |
          & $env:GODOT --headless --xr-mode off --main-pack dist/windows/jellyxr.pck --script tests/test_export_renderer.gd
          if ($LASTEXITCODE -ne 0) { throw 'Windows renderer settings check failed.' }

      - name: Verify exported Windows GPU adapter
        run: |
          $testScript = (Resolve-Path tests/test_d3d11_bridge.gd).Path
          $process = Start-Process -FilePath (Resolve-Path dist/windows/jellyxr.exe).Path -ArgumentList "--headless --xr-mode off --script `"$testScript`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Windows GPU adapter is missing from the exported engine.' }

      - name: Copy Windows licenses
        run: |
          Copy-Item build/desktop/licenses dist/windows/ -Recurse -Force
          Copy-Item build/desktop/templates/godot-license.txt, build/desktop/templates/godot-copyright.txt dist/windows/licenses/ -Force
          python tools/inspect-playback-libraries.py --bin-directory dist/windows --output dist/windows/library-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Exported LGPL library verification failed.' }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: jellyxr-windows
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
